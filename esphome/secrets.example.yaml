# Copy these values to your ESPHome secrets.yaml file.
# Never commit real credentials.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate unique values for your installation.
api_encryption_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
ota_password: "REPLACE_WITH_STRONG_OTA_PASSWORD"

# Battery divider values in ohms.
poolguard_battery_r_top: "1000000.0"
poolguard_battery_r_bottom: "330000.0"
