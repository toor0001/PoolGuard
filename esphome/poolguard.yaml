substitutions:
  device_name: poolguard
  friendly_name: PoolGuard

  # XIAO ESP32-C3 pin map: D7=GPIO20, D2=GPIO4, D3=GPIO5, D1=GPIO3.
  # None of these are ESP32-C3 strapping pins (GPIO2/GPIO8/GPIO9).
  a02_rx_pin: GPIO20
  a02_power_pin: GPIO4
  one_wire_pin: GPIO5
  battery_adc_pin: GPIO3

  # Normal low-power operation: one local motion check about once per minute.
  sleep_duration: 55s
  detection_burst_duration: 5s
  status_every_wakes: "30"

  # INITIAL CALIBRATION MODE
  # Set to true temporarily and flash PoolGuard. The node then stays awake and
  # online so water-level and motion calibration can be performed from HA.
  # Set back to false and flash again when commissioning is finished.
  calibration_mode_on_boot: "false"
  calibration_window_seconds: "5"
  calibration_windows: "12"

  # Pool geometry. Adjust these two values for another cylindrical pool.
  pool_diameter_m: "5.0"
  pool_max_depth_cm: "120.0"

  # Low-water hysteresis in centimetres. The actual minimum safe depth is an
  # editable Home Assistant number and MUST be determined on the real skimmer.
  low_water_hysteresis_cm: "1.0"

  # Fallback motion thresholds used until a complete valid calibration exists.
  pump_motion_threshold_cm: "1.5"
  person_motion_threshold_cm: "3.0"
  pump_confirm_cycles: "2"
  person_on_confirm_cycles: "1"
  person_off_confirm_cycles: "2"

  # BATTERY CALIBRATION
  battery_r_top: !secret poolguard_battery_r_top
  battery_r_bottom: !secret poolguard_battery_r_bottom

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Battery-powered pool-skimmer level, temperature and motion monitor
  includes:
    - poolguard_rtc.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          if (poolguard_rtc.magic != POOLGUARD_RTC_MAGIC) {
            poolguard_rtc.magic = POOLGUARD_RTC_MAGIC;
            poolguard_rtc.wake_count = 0;
            poolguard_rtc.pump_state = 0;
            poolguard_rtc.person_state = 0;
            poolguard_rtc.low_water_state = 0;
            poolguard_rtc.reported_pump_state = -1;
            poolguard_rtc.reported_person_state = -1;
            poolguard_rtc.reported_low_water_state = -1;
            poolguard_rtc.pump_on_streak = 0;
            poolguard_rtc.pump_off_streak = 0;
            poolguard_rtc.person_on_streak = 0;
            poolguard_rtc.person_off_streak = 0;
          }
          poolguard_rtc.wake_count++;
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
          id(report_needed) = false;
          id(status_report_due) = (poolguard_rtc.wake_count >= ${status_every_wakes});
          id(calibration_active) = false;
          id(calibration_target) = 0;
      - if:
          condition:
            lambda: 'return ${calibration_mode_on_boot};'
          then:
            - wifi.enable:
            - output.turn_off: a02_power
            - text_sensor.template.publish:
                id: calibration_status
                state: "Ready - set water reference and motion profiles"
            - logger.log: "Calibration mode active; A02 stays off until a calibration action starts"
          else:
            - output.turn_on: a02_power
            - delay: ${detection_burst_duration}
            - script.execute: evaluate_cycle

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: INFO

# Calibration writes are rare, so save learned values immediately rather than
# risking them being lost if power is removed straight afterwards.
preferences:
  flash_write_interval: 1s

api:
  id: poolguard_api
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: poolguard_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH
  enable_on_boot: false
  reboot_timeout: 0s

output:
  - platform: gpio
    id: a02_power
    pin: ${a02_power_pin}
    # Pololu ON is active-high. The GPIO output initializes inactive; during
    # reset/sleep the high-impedance pin leaves Pololu ON in its off state.

uart:
  id: a02_uart
  rx_pin: ${a02_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 256

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}
    id: poolguard_onewire

globals:
  - id: valid_frame_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: sample_distances_mm
    type: std::vector<int>
    restore_value: no
  - id: a02_frame
    type: std::vector<uint8_t>
    restore_value: no
  - id: report_needed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: status_report_due
    type: bool
    restore_value: no
    initial_value: "false"

  # WATER-LEVEL REFERENCE
  # One known real water depth plus the A02 distance measured at the same moment
  # is sufficient. Future depth follows directly from changes in A02 distance.
  - id: water_reference_distance_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: water_reference_depth_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"

  # Motion calibration values are written only during commissioning.
  - id: calibration_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: calibration_target
    type: int
    restore_value: no
    initial_value: "0"
  - id: calibration_samples
    type: std::vector<float>
    restore_value: no
  - id: calibrated_quiet_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: calibrated_pump_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: calibrated_person_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: learned_pump_threshold_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: learned_person_threshold_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"

number:
  # FIRST WATER-LEVEL CALIBRATION:
  # Measure the actual pool-water depth, enter it here and then press
  # "Set Water Level Reference" while the water remains at that level.
  - platform: template
    id: reference_water_depth_input
    name: "Reference Water Depth"
    unit_of_measurement: cm
    min_value: 0
    max_value: ${pool_max_depth_cm}
    step: 0.5
    initial_value: 110
    optimistic: true
    restore_value: true
    entity_category: config

  # Lowest ACTUAL water depth at which the skimmer can still supply the pump
  # safely. Determine this experimentally on the installed pool.
  - platform: template
    id: minimum_safe_water_depth
    name: "Minimum Safe Water Depth"
    unit_of_measurement: cm
    min_value: 0
    max_value: ${pool_max_depth_cm}
    step: 0.5
    initial_value: 100
    optimistic: true
    restore_value: true
    entity_category: config

sensor:
  - platform: dallas_temp
    one_wire_id: poolguard_onewire
    index: 0
    name: "Water Temperature"
    id: water_temperature
    resolution: 11
    update_interval: never

  # Voltage remains internal; Home Assistant receives Battery Level only.
  - platform: adc
    pin: ${battery_adc_pin}
    id: battery_voltage_raw
    internal: true
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: !lambda |-
          return (${battery_r_top} + ${battery_r_bottom}) / ${battery_r_bottom};
    on_value:
      then:
        - lambda: |-
            // Approximate rested single-cell Li-ion SOC. Still an estimate
            // under load, but closer to the flat discharge curve than a
            // direct linear voltage-to-percent mapping.
            static const float curve[][2] = {
                {3.20f, 0.0f},  {3.30f, 5.0f},  {3.50f, 15.0f},
                {3.65f, 35.0f}, {3.75f, 55.0f}, {3.85f, 70.0f},
                {4.00f, 85.0f}, {4.10f, 95.0f}, {4.20f, 100.0f}};
            const size_t points = sizeof(curve) / sizeof(curve[0]);
            float pct = curve[0][1];
            if (x >= curve[points - 1][0]) {
              pct = curve[points - 1][1];
            } else {
              for (size_t i = 1; i < points; i++) {
                if (x <= curve[i][0]) {
                  const float v0 = curve[i - 1][0];
                  const float p0 = curve[i - 1][1];
                  const float v1 = curve[i][0];
                  const float p1 = curve[i][1];
                  pct = p0 + (x - v0) * (p1 - p0) / (v1 - v0);
                  break;
                }
              }
            }
            pct = std::max(0.0f, std::min(100.0f, pct));
            id(battery_level).publish_state(pct);

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: never

  - platform: template
    id: distance_cm
    name: "Distance to Water"
    unit_of_measurement: cm
    accuracy_decimals: 1
    device_class: distance
    state_class: measurement
    update_interval: never

  - platform: template
    id: water_depth_cm
    name: "Water Depth"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  # Percentage of configured maximum pool depth.
  - platform: template
    id: water_level_percent
    name: "Water Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

  # Cylindrical volume approximation from configured diameter and current depth.
  - platform: template
    id: pool_volume_m3
    name: "Pool Volume"
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never

  - platform: template
    id: water_motion_cm
    name: "Water Surface Motion"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  - platform: template
    id: quiet_motion_profile
    name: "Calibration Quiet Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: pump_motion_profile
    name: "Calibration Pump Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: person_motion_profile
    name: "Calibration Person Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: active_pump_threshold
    name: "Active Pump Motion Threshold"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: active_person_threshold
    name: "Active Person Motion Threshold"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 10s
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: calibration_status
    name: "Calibration Status"
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: pump_detected
    name: "Pump Detected"
    device_class: running
  - platform: template
    id: person_detected
    name: "Person Detected"
    device_class: occupancy
  - platform: template
    id: low_water_level
    name: "Low Water Level"
    device_class: problem

button:
  - platform: template
    name: "Measure Now"
    on_press:
      - lambda: |-
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - output.turn_on: a02_power
      - delay: ${detection_burst_duration}
      - script.execute: evaluate_cycle

  # WATER-LEVEL REFERENCE CALIBRATION
  - platform: template
    name: "Set Water Level Reference"
    entity_category: config
    on_press:
      - lambda: |-
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - output.turn_on: a02_power
      - text_sensor.template.publish:
          id: calibration_status
          state: "Measuring water reference..."
      - delay: 5s
      - lambda: |-
          if (id(valid_frame_count) >= 5) {
            auto distances = id(sample_distances_mm);
            std::sort(distances.begin(), distances.end());
            const size_t n = distances.size();
            const float distance = ((n % 2)
                ? distances[n / 2]
                : 0.5f * (distances[n / 2 - 1] + distances[n / 2])) / 10.0f;
            id(water_reference_distance_cm) = distance;
            id(water_reference_depth_cm) = id(reference_water_depth_input).state;
            ESP_LOGI("poolguard", "Water reference saved: A02=%.2f cm, depth=%.1f cm",
                     distance, id(water_reference_depth_cm));
          } else {
            ESP_LOGW("poolguard", "Water reference failed: insufficient A02 frames");
          }
      - output.turn_off: a02_power
      - if:
          condition:
            lambda: 'return id(valid_frame_count) >= 5;'
          then:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Water reference saved"
          else:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Water reference failed - retry"

  - platform: template
    name: "Calibrate Quiet Water"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 1;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Calibrate Pump"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 2;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Calibrate Person"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 3;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Reset Motion Calibration"
    entity_category: config
    on_press:
      - lambda: |-
          id(calibrated_quiet_cm) = -1.0f;
          id(calibrated_pump_cm) = -1.0f;
          id(calibrated_person_cm) = -1.0f;
          id(learned_pump_threshold_cm) = -1.0f;
          id(learned_person_threshold_cm) = -1.0f;
          id(quiet_motion_profile).publish_state(NAN);
          id(pump_motion_profile).publish_state(NAN);
          id(person_motion_profile).publish_state(NAN);
          id(active_pump_threshold).publish_state(${pump_motion_threshold_cm});
          id(active_person_threshold).publish_state(${person_motion_threshold_cm});
      - text_sensor.template.publish:
          id: calibration_status
          state: "Motion calibration reset - fallback thresholds active"
  - platform: template
    name: "Finish Calibration and Sleep"
    entity_category: config
    on_press:
      - output.turn_off: a02_power
      - text_sensor.template.publish:
          id: calibration_status
          state: "Calibration finished"
      - delay: 1s
      - wifi.disable:
      - deep_sleep.enter:
          id: poolguard_sleep
          sleep_duration: ${sleep_duration}

script:
  - id: run_motion_calibration
    mode: single
    then:
      - lambda: |-
          if (id(calibration_active)) return;
          id(calibration_active) = true;
          id(calibration_samples).clear();
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - output.turn_on: a02_power
      - text_sensor.template.publish:
          id: calibration_status
          state: "Motion calibration running - keep condition unchanged"
      - repeat:
          count: ${calibration_windows}
          then:
            - lambda: |-
                id(sample_distances_mm).clear();
                id(valid_frame_count) = 0;
                id(a02_frame).clear();
            - delay: ${calibration_window_seconds}s
            - lambda: |-
                if (id(valid_frame_count) >= 5) {
                  auto distances = id(sample_distances_mm);
                  std::sort(distances.begin(), distances.end());
                  const size_t n = distances.size();
                  const size_t low_index = (n - 1) / 10;
                  const size_t high_index = ((n - 1) * 9) / 10;
                  id(calibration_samples).push_back(
                      (distances[high_index] - distances[low_index]) / 10.0f);
                }
      - output.turn_off: a02_power
      - lambda: |-
          auto &samples = id(calibration_samples);
          if (samples.size() < 8) {
            ESP_LOGW("poolguard", "Calibration failed: only %d valid windows",
                     (int) samples.size());
            id(calibration_active) = false;
            return;
          }
          std::sort(samples.begin(), samples.end());
          const size_t n = samples.size();
          const float median = (n % 2)
              ? samples[n / 2]
              : 0.5f * (samples[n / 2 - 1] + samples[n / 2]);

          if (id(calibration_target) == 1) {
            id(calibrated_quiet_cm) = median;
            id(quiet_motion_profile).publish_state(median);
          } else if (id(calibration_target) == 2) {
            id(calibrated_pump_cm) = median;
            id(pump_motion_profile).publish_state(median);
          } else if (id(calibration_target) == 3) {
            id(calibrated_person_cm) = median;
            id(person_motion_profile).publish_state(median);
          }

          if (id(calibrated_quiet_cm) >= 0.0f &&
              id(calibrated_pump_cm) >= 0.0f &&
              id(calibrated_person_cm) >= 0.0f) {
            if (id(calibrated_quiet_cm) < id(calibrated_pump_cm) &&
                id(calibrated_pump_cm) < id(calibrated_person_cm)) {
              id(learned_pump_threshold_cm) =
                  0.5f * (id(calibrated_quiet_cm) + id(calibrated_pump_cm));
              id(learned_person_threshold_cm) =
                  0.5f * (id(calibrated_pump_cm) + id(calibrated_person_cm));
              id(active_pump_threshold).publish_state(id(learned_pump_threshold_cm));
              id(active_person_threshold).publish_state(id(learned_person_threshold_cm));
            } else {
              ESP_LOGW("poolguard", "Calibration profiles overlap/out of order; previous thresholds retained");
            }
          }
          id(calibration_active) = false;
      - if:
          condition:
            lambda: 'return id(calibration_samples).size() < 8;'
          then:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Calibration failed - not enough valid A02 data"
          else:
            - if:
                condition:
                  lambda: |-
                    return id(calibrated_quiet_cm) >= 0.0f &&
                           id(calibrated_pump_cm) >= 0.0f &&
                           id(calibrated_person_cm) >= 0.0f &&
                           id(calibrated_quiet_cm) < id(calibrated_pump_cm) &&
                           id(calibrated_pump_cm) < id(calibrated_person_cm);
                then:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Motion calibration complete - learned thresholds active"
                else:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Profile saved - calibrate remaining conditions"

  - id: evaluate_cycle
    mode: restart
    then:
      - output.turn_off: a02_power
      - lambda: |-
          if (id(valid_frame_count) < 5) {
            ESP_LOGW("poolguard", "Not enough valid A02 frames: %d", id(valid_frame_count));
            id(report_needed) = id(status_report_due);
            return;
          }

          auto distances = id(sample_distances_mm);
          std::sort(distances.begin(), distances.end());
          const size_t n = distances.size();
          const size_t low_index = (n - 1) / 10;
          const size_t high_index = ((n - 1) * 9) / 10;
          const float distance_cm_value = ((n % 2)
              ? distances[n / 2]
              : 0.5f * (distances[n / 2 - 1] + distances[n / 2])) / 10.0f;
          const float motion_cm =
              (distances[high_index] - distances[low_index]) / 10.0f;
          id(distance_cm).publish_state(distance_cm_value);
          id(water_motion_cm).publish_state(motion_cm);

          float depth_cm = NAN;
          float level_pct = NAN;
          float volume_m3 = NAN;
          if (id(water_reference_distance_cm) > 0.0f &&
              id(water_reference_depth_cm) >= 0.0f) {
            depth_cm = id(water_reference_depth_cm) -
                       (distance_cm_value - id(water_reference_distance_cm));
            depth_cm = std::max(0.0f, std::min((float) ${pool_max_depth_cm}, depth_cm));
            level_pct = 100.0f * depth_cm / (float) ${pool_max_depth_cm};
            const float radius_m = ((float) ${pool_diameter_m}) * 0.5f;
            const float area_m2 = 3.14159265f * radius_m * radius_m;
            volume_m3 = area_m2 * (depth_cm / 100.0f);

            id(water_depth_cm).publish_state(depth_cm);
            id(water_level_percent).publish_state(level_pct);
            id(pool_volume_m3).publish_state(volume_m3);

            const float low_limit = id(minimum_safe_water_depth).state;
            const float low_clear = low_limit + ${low_water_hysteresis_cm};
            if (!poolguard_rtc.low_water_state && depth_cm <= low_limit) {
              poolguard_rtc.low_water_state = 1;
            } else if (poolguard_rtc.low_water_state && depth_cm >= low_clear) {
              poolguard_rtc.low_water_state = 0;
            }
            id(low_water_level).publish_state(poolguard_rtc.low_water_state != 0);
          } else {
            id(water_depth_cm).publish_state(NAN);
            id(water_level_percent).publish_state(NAN);
            id(pool_volume_m3).publish_state(NAN);
            ESP_LOGW("poolguard", "Water level not calibrated yet");
          }

          const float pump_threshold = id(learned_pump_threshold_cm) > 0.0f
              ? id(learned_pump_threshold_cm) : ${pump_motion_threshold_cm};
          const float person_threshold = id(learned_person_threshold_cm) > 0.0f
              ? id(learned_person_threshold_cm) : ${person_motion_threshold_cm};
          id(active_pump_threshold).publish_state(pump_threshold);
          id(active_person_threshold).publish_state(person_threshold);

          const bool raw_person = motion_cm >= person_threshold;
          if (raw_person) {
            poolguard_rtc.person_off_streak = 0;
            if (!poolguard_rtc.person_state) {
              poolguard_rtc.person_on_streak++;
              if (poolguard_rtc.person_on_streak >= ${person_on_confirm_cycles}) {
                poolguard_rtc.person_state = 1;
                poolguard_rtc.person_on_streak = 0;
              }
            } else {
              poolguard_rtc.person_on_streak = 0;
            }
          } else {
            poolguard_rtc.person_on_streak = 0;
            if (poolguard_rtc.person_state) {
              poolguard_rtc.person_off_streak++;
              if (poolguard_rtc.person_off_streak >= ${person_off_confirm_cycles}) {
                poolguard_rtc.person_state = 0;
                poolguard_rtc.person_off_streak = 0;
              }
            } else {
              poolguard_rtc.person_off_streak = 0;
            }
          }

          // Pump state is intentionally held while person-like motion is active.
          if (!poolguard_rtc.person_state) {
            const bool raw_pump = motion_cm >= pump_threshold;
            if (raw_pump) {
              poolguard_rtc.pump_off_streak = 0;
              if (!poolguard_rtc.pump_state) {
                poolguard_rtc.pump_on_streak++;
                if (poolguard_rtc.pump_on_streak >= ${pump_confirm_cycles}) {
                  poolguard_rtc.pump_state = 1;
                  poolguard_rtc.pump_on_streak = 0;
                }
              } else {
                poolguard_rtc.pump_on_streak = 0;
              }
            } else {
              poolguard_rtc.pump_on_streak = 0;
              if (poolguard_rtc.pump_state) {
                poolguard_rtc.pump_off_streak++;
                if (poolguard_rtc.pump_off_streak >= ${pump_confirm_cycles}) {
                  poolguard_rtc.pump_state = 0;
                  poolguard_rtc.pump_off_streak = 0;
                }
              } else {
                poolguard_rtc.pump_off_streak = 0;
              }
            }
          }

          id(pump_detected).publish_state(poolguard_rtc.pump_state != 0);
          id(person_detected).publish_state(poolguard_rtc.person_state != 0);

          const bool pump_changed =
              poolguard_rtc.reported_pump_state != poolguard_rtc.pump_state;
          const bool person_changed =
              poolguard_rtc.reported_person_state != poolguard_rtc.person_state;
          const bool low_water_changed =
              poolguard_rtc.reported_low_water_state != poolguard_rtc.low_water_state;
          id(report_needed) =
              pump_changed || person_changed || low_water_changed || id(status_report_due);

          ESP_LOGI("poolguard",
                   "frames=%d distance=%.1fcm motion=%.1fcm depth=%.1fcm level=%.0f%% volume=%.2fm3 pump=%d person=%d low_water=%d report=%d",
                   id(valid_frame_count), distance_cm_value, motion_cm, depth_cm, level_pct,
                   volume_m3, poolguard_rtc.pump_state, poolguard_rtc.person_state,
                   poolguard_rtc.low_water_state, id(report_needed));
      - if:
          condition:
            lambda: 'return id(status_report_due);'
          then:
            - component.update: water_temperature
            - component.update: battery_voltage_raw
            - delay: 800ms
      - if:
          condition:
            lambda: 'return id(report_needed);'
          then:
            - wifi.enable:
            - wait_until:
                condition:
                  api.connected:
                    state_subscription_only: true
                timeout: 15s
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  - delay: 750ms
                  - lambda: |-
                      poolguard_rtc.reported_pump_state = poolguard_rtc.pump_state;
                      poolguard_rtc.reported_person_state = poolguard_rtc.person_state;
                      poolguard_rtc.reported_low_water_state = poolguard_rtc.low_water_state;
                      if (id(status_report_due)) poolguard_rtc.wake_count = 0;
                else:
                  - logger.log:
                      level: WARN
                      format: "WiFi/API timeout; state change remains pending and will be retried next wake"
            - wifi.disable:
      - deep_sleep.enter:
          id: poolguard_sleep
          sleep_duration: ${sleep_duration}

interval:
  - interval: 20ms
    then:
      - lambda: |-
          while (id(a02_uart).available()) {
            uint8_t byte;
            if (!id(a02_uart).read_byte(&byte)) break;
            auto &frame = id(a02_frame);
            if (frame.empty()) {
              if (byte == 0xFF) frame.push_back(byte);
              continue;
            }
            frame.push_back(byte);
            if (frame.size() < 4) continue;
            const uint8_t checksum = (frame[0] + frame[1] + frame[2]) & 0xFF;
            if (checksum == frame[3]) {
              const int distance_mm = (frame[1] << 8) | frame[2];
              if (distance_mm >= 30 && distance_mm <= 4500) {
                id(sample_distances_mm).push_back(distance_mm);
                id(valid_frame_count)++;
              }
            }
            frame.clear();
          }

deep_sleep:
  id: poolguard_sleep

# FIRST WATER-LEVEL CALIBRATION
# 1. Set calibration_mode_on_boot to true and flash PoolGuard.
# 2. Measure the actual current pool-water depth in centimetres.
# 3. Enter it in Home Assistant under "Reference Water Depth".
# 4. Press "Set Water Level Reference". PoolGuard stores the current A02
#    distance together with the known real water depth.
# 5. Set "Minimum Safe Water Depth" to the real lowest depth at which the
#    skimmer still supplies the circulation pump safely.
# 6. Sensor-to-bottom distance does not have to be measured separately.
#
# POOL VOLUME
# Volume assumes a cylinder: pi * radius^2 * current water depth.
# Defaults: diameter 5.0 m, maximum depth 120 cm. At 120 cm this is ~23.56 m3.
#
# MOTION CALIBRATION
# In calibration mode run Quiet Water, Pump and Person for ~60 s each. Learned
# thresholds are based on a trimmed sample span and stored persistently. Set
# calibration_mode_on_boot back to false and flash again when commissioning is
# complete.
