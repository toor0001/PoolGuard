substitutions:
  device_name: poolguard
  friendly_name: PoolGuard

  # XIAO ESP32-C3 pin map: D7=GPIO20, D2=GPIO4, D3=GPIO5, D1=GPIO3.
  # None of these are ESP32-C3 strapping pins (GPIO2/GPIO8/GPIO9).
  a02_rx_pin: GPIO20
  a02_power_pin: GPIO4
  a02_trigger_pin: GPIO3
  one_wire_pin: GPIO5

  # Normal low-power operation. The desired wake-to-wake period and periodic
  # report cadence are persistent Home Assistant numbers defined below.
  detection_burst_duration: 5s
  a02_startup_duration: 200ms
  a02_trigger_low_duration: 2ms
  a02_trigger_interval_rest: 78ms
  a02_frame_wait_after_triggers: 70ms

  # Motion-calibration sampling. Initial Setup Mode itself is controlled by a
  # persistent flash-backed flag and therefore needs no compile-time switch.
  calibration_window_seconds: "5"
  calibration_windows: "12"

  # Pool geometry. Adjust these two values for another cylindrical pool.
  pool_diameter_m: "5.0"
  pool_max_depth_cm: "120.0"

  # Low-water hysteresis in centimetres. The actual minimum safe depth is an
  # editable Home Assistant number and MUST be determined on the real skimmer.
  low_water_hysteresis_cm: "1.0"
  # A single low reading is treated as a candidate only. Low Water becomes
  # active after this many consecutive measurement cycles below the limit.
  low_water_confirm_cycles: "3"

  # Fallback motion thresholds used until a complete valid calibration exists.
  pump_motion_threshold_cm: "1.5"
  person_motion_threshold_cm: "3.0"
  pump_confirm_cycles: "2"
  person_on_confirm_cycles: "1"
  person_off_confirm_cycles: "2"

  # After the first reported person detection, suppress further person-triggered
  # reports for three hours. Detection continues locally during the lockout,
  # but it does not wake Wi-Fi/API again just because motion toggles.
  person_alert_cooldown_minutes: "180"

  # Person/activity detection deliberately uses a higher entry threshold than
  # the simple midpoint between Pump and Person profiles. Clearing uses the
  # midpoint. Together with two independent half-burst checks this provides
  # hysteresis without delaying a real detection across multiple wake cycles.
  person_profile_on_fraction: "0.65"
  person_profile_clear_fraction: "0.50"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Battery-powered pool-skimmer level, temperature and motion monitor
  includes:
    - poolguard_rtc.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          ESP_LOGI("poolguard",
                   "BOOT DIAGNOSTICS: reset_reason=%d wakeup_cause=%d",
                   (int) esp_reset_reason(),
                   (int) esp_sleep_get_wakeup_cause());

          if (poolguard_rtc.magic != POOLGUARD_RTC_MAGIC) {
            poolguard_rtc.magic = POOLGUARD_RTC_MAGIC;
            poolguard_rtc.report_sequence = 0;
            poolguard_rtc.wake_count = 0;
            poolguard_rtc.pump_state = 0;
            poolguard_rtc.person_state = 0;
            poolguard_rtc.low_water_state = 0;
            poolguard_rtc.reported_pump_state = -1;
            poolguard_rtc.reported_person_state = -1;
            poolguard_rtc.reported_low_water_state = -1;
            poolguard_rtc.pump_on_streak = 0;
            poolguard_rtc.pump_off_streak = 0;
            poolguard_rtc.person_on_streak = 0;
            poolguard_rtc.person_off_streak = 0;
            poolguard_rtc.low_water_on_streak = 0;
            poolguard_rtc.low_water_trigger_depth_cm = NAN;
            poolguard_rtc.person_alert_cooldown_minutes = 0;
          }
          // Person-alert cooldown is kept only in RTC memory. Normal measurement
          // wakes therefore reduce the lockout without flash writes.
          if (poolguard_rtc.person_alert_cooldown_minutes > 0) {
            const float configured_minutes = id(measurement_interval_minutes).state;
            uint16_t elapsed_minutes = (uint16_t) std::lround(
                std::isfinite(configured_minutes) ? configured_minutes : 2.0f);
            if (elapsed_minutes < 1) elapsed_minutes = 1;

            if (elapsed_minutes >= poolguard_rtc.person_alert_cooldown_minutes) {
              poolguard_rtc.person_alert_cooldown_minutes = 0;
            } else {
              poolguard_rtc.person_alert_cooldown_minutes -= elapsed_minutes;
            }
          }

          poolguard_rtc.wake_count++;
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
          id(report_needed) = false;
          id(status_report_due) = false;
          id(calibration_active) = false;
          id(calibration_target) = 0;
      # Controlled-UART RX idles high. The A02 is still unpowered here, so the
      # output's transition during boot cannot trigger an ultrasonic reading.
      - output.turn_on: a02_trigger
      - if:
          condition:
            lambda: 'return !id(initial_setup_completed);'
          then:
            - deep_sleep.prevent: poolguard_sleep
            - wifi.enable:
            - output.turn_off: a02_power
            - text_sensor.template.publish:
                id: poolguard_status
                state: "Initial Setup"
            - text_sensor.template.publish:
                id: calibration_status
                state: "Ready - set water reference and motion profiles"
            - logger.log: "Initial Setup Mode active; A02 stays off until a measurement or calibration starts"
          else:
            - text_sensor.template.publish:
                id: poolguard_status
                state: "Measuring"
            - script.execute: start_a02_measurements
            - script.wait: start_a02_measurements
            - delay: ${detection_burst_duration}
            - script.execute: stop_a02_measurements
            - script.wait: stop_a02_measurements
            - script.execute: evaluate_cycle

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Calibration writes are rare, so save learned values immediately rather than
# risking them being lost if power is removed straight afterwards.
preferences:
  flash_write_interval: 1s

api:
  id: poolguard_api
  reboot_timeout: 0s
  encryption:
    key: !secret poolguard_api_encryption_key

ota:
  - platform: esphome
    password: !secret poolguard_ota_password

wifi:
  id: poolguard_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Normal battery wakes stay completely offline. Initial Setup, Maintenance
  # and report paths explicitly enable Wi-Fi when they need it.
  enable_on_boot: false
  fast_connect:
    enabled: true
    # Avoid updating flash with connection details after every report.
    storage: rtc
  power_save_mode: HIGH
  reboot_timeout: 0s

output:
  - platform: gpio
    id: a02_power
    pin: ${a02_power_pin}
    # Pololu ON is active-high. The GPIO output initializes inactive; during
    # reset/sleep the high-impedance pin leaves Pololu ON in its off state.

  - platform: gpio
    id: a02_trigger
    pin: ${a02_trigger_pin}
    # DYP UART-Controlled RX is active on a falling edge. Keep it high whenever
    # no measurement is requested. The A02 is unpowered during reset and deep
    # sleep, where this ESP pin may become high-impedance.

uart:
  id: a02_uart
  rx_pin: ${a02_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 256

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}
    id: poolguard_onewire

globals:
  # Written only when setup is finished or reset. ESPHome preferences are
  # flash-backed, so this survives deep sleep, resets and full power loss.
  - id: initial_setup_completed
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: reset_initial_setup_armed_at
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: reset_initial_setup_confirmed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: valid_frame_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: sample_distances_mm
    type: std::vector<int>
    restore_value: no
  - id: a02_frame
    type: std::vector<uint8_t>
    restore_value: no
  - id: report_needed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: status_report_due
    type: bool
    restore_value: no
    initial_value: "false"
  # Runtime mirror of Home Assistant's persistent input_boolean. Deliberately
  # not restored: after an unexpected reset PoolGuard defaults to low-power
  # operation and accepts ON again at its next normal API connection.
  - id: maintenance_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: a02_triggering_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: a02_trigger_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # WATER-LEVEL REFERENCE
  # One known real water depth plus the A02 distance measured at the same moment
  # is sufficient. Future depth follows directly from changes in A02 distance.
  - id: water_reference_distance_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: water_reference_depth_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"

  # Motion calibration values are written only during commissioning.
  - id: calibration_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: calibration_target
    type: int
    restore_value: no
    initial_value: "0"
  - id: calibration_samples
    type: std::vector<float>
    restore_value: no
  - id: calibrated_quiet_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: calibrated_pump_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: calibrated_person_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: learned_pump_threshold_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"
  - id: learned_person_threshold_cm
    type: float
    restore_value: yes
    initial_value: "-1.0"

number:
  # Persistent user settings are written only when changed. Measurement
  # values and the RTC wake counter are never copied to flash each wake.
  - platform: template
    id: measurement_interval_minutes
    name: "Measurement Interval"
    unit_of_measurement: min
    min_value: 1
    max_value: 15
    step: 1
    initial_value: 2
    optimistic: true
    restore_value: true
    entity_category: config

  - platform: template
    id: periodic_report_every_wakes
    name: "Periodic Report Every"
    unit_of_measurement: wakes
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    entity_category: config

  # FIRST WATER-LEVEL CALIBRATION:
  # Measure the actual pool-water depth, enter it here and then press
  # "Set Water Level Reference" while the water remains at that level.
  - platform: template
    id: reference_water_depth_input
    name: "Reference Water Depth"
    unit_of_measurement: cm
    min_value: 0
    max_value: ${pool_max_depth_cm}
    step: 0.5
    initial_value: 110
    optimistic: true
    restore_value: true
    entity_category: config

  # Lowest ACTUAL water depth at which the skimmer can still supply the pump
  # safely. Determine this experimentally on the installed pool.
  - platform: template
    id: minimum_safe_water_depth
    name: "Minimum Safe Water Depth"
    unit_of_measurement: cm
    min_value: 0
    max_value: ${pool_max_depth_cm}
    step: 0.5
    initial_value: 100
    optimistic: true
    restore_value: true
    entity_category: config

  # Applied by the DS18B20 sensor filter at the next temperature conversion.
  # ESPHome persists this user setting only when it changes, not on each wake.
  - platform: template
    id: water_temperature_offset
    name: "Water Temperature Offset"
    unit_of_measurement: "°C"
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.0
    optimistic: true
    restore_value: true
    entity_category: config

sensor:
  - platform: template
    id: status_heartbeat
    name: "Status Heartbeat"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  - platform: dallas_temp
    one_wire_id: poolguard_onewire
    index: 0
    name: "Water Temperature"
    id: water_temperature
    resolution: 11
    update_interval: never
    filters:
      - lambda: 'return x + id(water_temperature_offset).state;'

  - platform: template
    id: distance_cm
    name: "Distance to Water"
    unit_of_measurement: cm
    accuracy_decimals: 1
    device_class: distance
    state_class: measurement
    update_interval: never

  - platform: template
    id: water_depth_cm
    name: "Water Depth"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  # Stores the exact depth of the measurement that confirmed a low-water alarm.
  # This makes Home Assistant notifications independent of later measurements.
  - platform: template
    id: low_water_trigger_depth
    name: "Low Water Trigger Depth"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

  # Percentage of configured maximum pool depth.
  - platform: template
    id: water_level_percent
    name: "Water Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

  # Cylindrical volume approximation from configured diameter and current depth.
  - platform: template
    id: pool_volume_m3
    name: "Pool Volume"
    unit_of_measurement: "m³"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never

  - platform: template
    id: water_motion_cm
    name: "Water Surface Motion"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  - platform: template
    id: quiet_motion_profile
    name: "Calibration Quiet Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: pump_motion_profile
    name: "Calibration Pump Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: person_motion_profile
    name: "Calibration Person Motion"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: active_pump_threshold
    name: "Active Pump Motion Threshold"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: active_person_threshold
    name: "Active Person Motion Threshold"
    unit_of_measurement: cm
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 10s
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: poolguard_status
    name: "PoolGuard Status"
    entity_category: diagnostic

  - platform: template
    id: calibration_status
    name: "Calibration Status"
    entity_category: diagnostic

binary_sensor:
  # Home Assistant owns the requested state because PoolGuard is normally
  # asleep. Create input_boolean.poolguard_maintenance_mode in HA; its retained
  # state is delivered here on the next API connection that normal reporting
  # would have made anyway. This does not add a periodic Wi-Fi check.
  - platform: homeassistant
    id: maintenance_mode_request
    entity_id: input_boolean.poolguard_maintenance_mode
    internal: true
    # The retained helper state arrives as the first valid state after every
    # API connection, so its initial publication must run the automation.
    trigger_on_initial_state: true
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lambda: 'id(maintenance_active) = true;'
              - wifi.enable:
              - text_sensor.template.publish:
                  id: poolguard_status
                  state: "Maintenance"
              - script.execute: maintenance_measurements
              - logger.log: "Maintenance Mode enabled by Home Assistant"
            else:
              - if:
                  condition:
                    lambda: 'return id(maintenance_active);'
                  then:
                    - lambda: 'id(maintenance_active) = false;'
                    - script.execute: leave_maintenance_mode
  - platform: template
    id: pump_detected
    name: "Pump Detected"
    device_class: running
  - platform: template
    id: person_detected
    name: "Person Detected"
    device_class: occupancy
  - platform: template
    id: low_water_level
    name: "Low Water Level"
    device_class: problem

button:
  - platform: template
    name: "Measure Now"
    on_press:
      - lambda: |-
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - script.execute: start_a02_measurements
      - script.wait: start_a02_measurements
      - delay: ${detection_burst_duration}
      - script.execute: stop_a02_measurements
      - script.wait: stop_a02_measurements
      - script.execute: evaluate_cycle

  # WATER-LEVEL REFERENCE CALIBRATION
  - platform: template
    name: "Set Water Level Reference"
    entity_category: config
    on_press:
      - lambda: |-
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - script.execute: start_a02_measurements
      - script.wait: start_a02_measurements
      - text_sensor.template.publish:
          id: calibration_status
          state: "Measuring water reference..."
      - delay: 5s
      - script.execute: stop_a02_measurements
      - script.wait: stop_a02_measurements
      - lambda: |-
          if (id(valid_frame_count) >= 5) {
            auto distances = id(sample_distances_mm);
            std::sort(distances.begin(), distances.end());
            const size_t n = distances.size();
            const float distance = ((n % 2)
                ? distances[n / 2]
                : 0.5f * (distances[n / 2 - 1] + distances[n / 2])) / 10.0f;
            id(water_reference_distance_cm) = distance;
            id(water_reference_depth_cm) = id(reference_water_depth_input).state;
            ESP_LOGI("poolguard", "Water reference saved: A02=%.2f cm, depth=%.1f cm",
                     distance, id(water_reference_depth_cm));
          } else {
            ESP_LOGW("poolguard", "Water reference failed: insufficient A02 frames");
          }
      - if:
          condition:
            lambda: 'return id(valid_frame_count) >= 5;'
          then:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Water reference saved"
          else:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Water reference failed - retry"

  - platform: template
    name: "Calibrate Quiet Water"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 1;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Calibrate Pump"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 2;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Calibrate Person"
    entity_category: config
    on_press:
      - lambda: 'id(calibration_target) = 3;'
      - script.execute: run_motion_calibration
  - platform: template
    name: "Reset Motion Calibration"
    entity_category: config
    on_press:
      - lambda: |-
          id(calibrated_quiet_cm) = -1.0f;
          id(calibrated_pump_cm) = -1.0f;
          id(calibrated_person_cm) = -1.0f;
          id(learned_pump_threshold_cm) = -1.0f;
          id(learned_person_threshold_cm) = -1.0f;
          id(quiet_motion_profile).publish_state(NAN);
          id(pump_motion_profile).publish_state(NAN);
          id(person_motion_profile).publish_state(NAN);
          id(active_pump_threshold).publish_state(${pump_motion_threshold_cm});
          id(active_person_threshold).publish_state(${person_motion_threshold_cm});
      - text_sensor.template.publish:
          id: calibration_status
          state: "Motion calibration reset - fallback thresholds active"
  - platform: template
    name: "Finish Initial Setup"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              return !id(calibration_active) &&
                     id(water_reference_distance_cm) > 0.0f &&
                     id(water_reference_depth_cm) >= 0.0f;
          then:
            - script.stop: run_motion_calibration
            - script.stop: maintenance_measurements
            - script.stop: evaluate_cycle
            - lambda: 'id(a02_triggering_active) = false;'
            - script.stop: trigger_a02_measurements
            - output.turn_on: a02_trigger
            - output.turn_off: a02_power
            - lambda: |-
                const bool motion_complete =
                    id(calibrated_quiet_cm) >= 0.0f &&
                    id(calibrated_pump_cm) >= 0.0f &&
                    id(calibrated_person_cm) >= 0.0f &&
                    id(calibrated_quiet_cm) < id(calibrated_pump_cm) &&
                    id(calibrated_pump_cm) < id(calibrated_person_cm);
                if (!motion_complete) {
                  ESP_LOGW("poolguard", "Initial setup completed without a full valid motion calibration; fallback or previously learned thresholds remain active");
                }
                id(initial_setup_completed) = true;
            - text_sensor.template.publish:
                id: calibration_status
                state: "Initial setup complete - starting battery operation"
            # Allow the preference write to be committed before sleeping.
            - delay: 2s
            - deep_sleep.allow: poolguard_sleep
            - script.execute: enter_low_power_sleep
          else:
            - if:
                condition:
                  lambda: 'return id(calibration_active);'
                then:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Finish refused - calibration still running"
                  - logger.log:
                      level: WARN
                      format: "Finish Initial Setup refused: motion calibration is still running"
                else:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Finish refused - set water reference first"
                  - logger.log:
                      level: WARN
                      format: "Finish Initial Setup refused: valid water reference required"

  - platform: template
    name: "Reset Initial Setup"
    entity_category: config
    on_press:
      - lambda: |-
          id(reset_initial_setup_confirmed) = false;
          if (!id(initial_setup_completed)) {
            id(reset_initial_setup_armed_at) = 0;
            id(calibration_status).publish_state("Initial Setup Mode is already active");
            return;
          }
          const uint32_t now = millis();
          if (id(reset_initial_setup_armed_at) != 0 &&
              (uint32_t) (now - id(reset_initial_setup_armed_at)) <= 10000) {
            id(reset_initial_setup_armed_at) = 0;
            id(reset_initial_setup_confirmed) = true;
            id(initial_setup_completed) = false;
          } else {
            id(reset_initial_setup_armed_at) = now == 0 ? 1 : now;
            id(calibration_status).publish_state("Press Reset Initial Setup again within 10 seconds");
            ESP_LOGW("poolguard", "Initial setup reset armed; press again within 10 seconds to confirm");
          }
      - if:
          condition:
            lambda: 'return id(reset_initial_setup_confirmed);'
          then:
            - deep_sleep.prevent: poolguard_sleep
            - script.stop: maintenance_measurements
            - script.stop: evaluate_cycle
            - lambda: 'id(maintenance_active) = false;'
            - lambda: 'id(a02_triggering_active) = false;'
            - script.stop: trigger_a02_measurements
            - output.turn_on: a02_trigger
            - output.turn_off: a02_power
            - wifi.enable:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Initial setup reset - setup mode active"
            - logger.log: "Initial setup reset; staying awake with A02 off"

script:
  # One shared sleep path is used everywhere. When the API is connected,
  # publish the final status and leave the connection intact so ESPHome's deep
  # sleep component can perform its clean, expected disconnect. Subtracting
  # active time keeps the wake-to-wake period close to the configured value.
  - id: enter_low_power_sleep
    mode: restart
    then:
      - output.turn_on: a02_trigger
      - output.turn_off: a02_power
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - text_sensor.template.publish:
                id: poolguard_status
                state: "Sleeping / Offline"
            - delay: 500ms
      - lambda: |-
          const float configured_minutes = id(measurement_interval_minutes).state;
          const uint32_t period_ms =
              (uint32_t) ((std::isfinite(configured_minutes) ? configured_minutes : 2.0f) * 60000.0f);
          const uint32_t active_ms = millis();
          const uint32_t sleep_ms = period_ms > active_ms + 1000U
              ? period_ms - active_ms : 1000U;
          ESP_LOGI("poolguard",
                   "Entering deep sleep: period=%u ms active=%u ms sleep=%u ms",
                   (unsigned) period_ms, (unsigned) active_ms, (unsigned) sleep_ms);
      - deep_sleep.enter:
          id: poolguard_sleep
          sleep_duration: !lambda |-
            const float configured_minutes = id(measurement_interval_minutes).state;
            const uint32_t period_ms =
                (uint32_t) ((std::isfinite(configured_minutes) ? configured_minutes : 2.0f) * 60000.0f);
            const uint32_t active_ms = millis();
            return period_ms > active_ms + 1000U ? period_ms - active_ms : 1000U;

  # Shared DYP A02 UART-Controlled measurement sequence. RX idles high. Once
  # sensor power is stable, each high-to-low transition requests one reading.
  - id: start_a02_measurements
    mode: single
    then:
      - output.turn_on: a02_trigger
      - lambda: |-
          id(a02_triggering_active) = false;
          id(a02_trigger_count) = 0;
      - output.turn_on: a02_power
      - logger.log: "A02 power ON; waiting for sensor startup"
      - delay: ${a02_startup_duration}
      - lambda: 'id(a02_triggering_active) = true;'
      - script.execute: trigger_a02_measurements

  - id: trigger_a02_measurements
    mode: single
    then:
      - while:
          condition:
            lambda: 'return id(a02_triggering_active);'
          then:
            - output.turn_off: a02_trigger
            - delay: ${a02_trigger_low_duration}
            - output.turn_on: a02_trigger
            - lambda: |-
                id(a02_trigger_count)++;
                if (id(a02_trigger_count) == 1) {
                  ESP_LOGD("poolguard", "A02 trigger sent; repeated 80 ms triggering active");
                }
            - delay: ${a02_trigger_interval_rest}

  - id: stop_a02_measurements
    mode: single
    then:
      - lambda: 'id(a02_triggering_active) = false;'
      - script.wait: trigger_a02_measurements
      - output.turn_on: a02_trigger
      - delay: ${a02_frame_wait_after_triggers}
      - output.turn_off: a02_power
      - lambda: |-
          ESP_LOGD("poolguard", "A02 power OFF; triggers=%u valid_frames=%d",
                   (unsigned) id(a02_trigger_count), id(valid_frame_count));

  # Re-publish the complete current payload only after Home Assistant has
  # connected for an already-required report. Values without a state in this
  # boot are omitted so HA keeps its last successfully reported value.
  - id: publish_report_payload
    mode: single
    then:
      - lambda: |-
          if (id(distance_cm).has_state())
            id(distance_cm).publish_state(id(distance_cm).state);
          if (id(water_depth_cm).has_state())
            id(water_depth_cm).publish_state(id(water_depth_cm).state);
          if (std::isfinite(poolguard_rtc.low_water_trigger_depth_cm))
            id(low_water_trigger_depth).publish_state(poolguard_rtc.low_water_trigger_depth_cm);
          if (id(water_level_percent).has_state())
            id(water_level_percent).publish_state(id(water_level_percent).state);
          if (id(pool_volume_m3).has_state())
            id(pool_volume_m3).publish_state(id(pool_volume_m3).state);
          // Do NOT re-publish water_temperature here. The Dallas sensor's
          // component.update above already publishes the freshly corrected value.
          // Re-publishing its current state would run the offset filter a second time.
          if (id(water_motion_cm).has_state())
            id(water_motion_cm).publish_state(id(water_motion_cm).state);

          id(pump_detected).publish_state(poolguard_rtc.pump_state != 0);
          id(person_detected).publish_state(poolguard_rtc.person_state != 0);
          id(low_water_level).publish_state(poolguard_rtc.low_water_state != 0);

          if (id(calibrated_quiet_cm) >= 0.0f)
            id(quiet_motion_profile).publish_state(id(calibrated_quiet_cm));
          if (id(calibrated_pump_cm) >= 0.0f)
            id(pump_motion_profile).publish_state(id(calibrated_pump_cm));
          if (id(calibrated_person_cm) >= 0.0f)
            id(person_motion_profile).publish_state(id(calibrated_person_cm));

          const float pump_threshold = id(learned_pump_threshold_cm) > 0.0f
              ? id(learned_pump_threshold_cm) : ${pump_motion_threshold_cm};
          const bool valid_person_profiles =
              id(calibrated_pump_cm) >= 0.0f &&
              id(calibrated_person_cm) > id(calibrated_pump_cm);
          const float person_threshold = valid_person_profiles
              ? id(calibrated_pump_cm) + ${person_profile_on_fraction}f *
                    (id(calibrated_person_cm) - id(calibrated_pump_cm))
              : (id(learned_person_threshold_cm) > 0.0f
                    ? id(learned_person_threshold_cm) : ${person_motion_threshold_cm});
          id(active_pump_threshold).publish_state(pump_threshold);
          id(active_person_threshold).publish_state(person_threshold);

          poolguard_rtc.report_sequence++;
          id(status_heartbeat).publish_state(poolguard_rtc.report_sequence);
          ESP_LOGI("poolguard", "Complete report payload published; sequence=%u",
                   (unsigned) poolguard_rtc.report_sequence);

  # Five-second powered measurement bursts are more conservative than leaving
  # the A02 continuously powered. evaluate_cycle switches Pololu ON off before
  # processing each burst and cannot enter deep sleep while maintenance is on.
  - id: maintenance_measurements
    mode: single
    then:
      - while:
          condition:
            lambda: 'return id(maintenance_active);'
          then:
            - lambda: |-
                id(sample_distances_mm).clear();
                id(valid_frame_count) = 0;
                id(a02_frame).clear();
            - script.execute: start_a02_measurements
            - script.wait: start_a02_measurements
            - delay: ${detection_burst_duration}
            - script.execute: stop_a02_measurements
            - script.wait: stop_a02_measurements
            - script.execute: evaluate_cycle
            - script.wait: evaluate_cycle

  - id: leave_maintenance_mode
    mode: restart
    then:
      - script.stop: maintenance_measurements
      - script.stop: evaluate_cycle
      - lambda: 'id(a02_triggering_active) = false;'
      - script.stop: trigger_a02_measurements
      - output.turn_on: a02_trigger
      - output.turn_off: a02_power
      - component.update: water_temperature
      - delay: 800ms
      - if:
          condition:
            lambda: 'return !id(initial_setup_completed);'
          then:
            - deep_sleep.prevent: poolguard_sleep
            - wifi.enable:
            - logger.log: "Maintenance Mode disabled; remaining awake in Initial Setup Mode"
          else:
            - logger.log: "Maintenance Mode disabled; returning to normal deep sleep"
            - script.execute: enter_low_power_sleep

  - id: run_motion_calibration
    mode: single
    then:
      - lambda: |-
          if (id(calibration_active)) return;
          id(calibration_active) = true;
          id(calibration_samples).clear();
          id(sample_distances_mm).clear();
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
      - script.execute: start_a02_measurements
      - script.wait: start_a02_measurements
      - text_sensor.template.publish:
          id: calibration_status
          state: "Motion calibration running - keep condition unchanged"
      - repeat:
          count: ${calibration_windows}
          then:
            - lambda: |-
                id(sample_distances_mm).clear();
                id(valid_frame_count) = 0;
                id(a02_frame).clear();
            - delay: ${calibration_window_seconds}s
            - lambda: |-
                if (id(valid_frame_count) >= 5) {
                  auto distances = id(sample_distances_mm);
                  std::sort(distances.begin(), distances.end());
                  const size_t n = distances.size();
                  const size_t low_index = (n - 1) / 10;
                  const size_t high_index = ((n - 1) * 9) / 10;
                  id(calibration_samples).push_back(
                      (distances[high_index] - distances[low_index]) / 10.0f);
                }
      - script.execute: stop_a02_measurements
      - script.wait: stop_a02_measurements
      - lambda: |-
          auto &samples = id(calibration_samples);
          if (samples.size() < 8) {
            ESP_LOGW("poolguard", "Calibration failed: only %d valid windows",
                     (int) samples.size());
            id(calibration_active) = false;
            return;
          }
          std::sort(samples.begin(), samples.end());
          const size_t n = samples.size();
          const float median = (n % 2)
              ? samples[n / 2]
              : 0.5f * (samples[n / 2 - 1] + samples[n / 2]);

          if (id(calibration_target) == 1) {
            id(calibrated_quiet_cm) = median;
            id(quiet_motion_profile).publish_state(median);
          } else if (id(calibration_target) == 2) {
            id(calibrated_pump_cm) = median;
            id(pump_motion_profile).publish_state(median);
          } else if (id(calibration_target) == 3) {
            id(calibrated_person_cm) = median;
            id(person_motion_profile).publish_state(median);
          }

          if (id(calibrated_quiet_cm) >= 0.0f &&
              id(calibrated_pump_cm) >= 0.0f &&
              id(calibrated_person_cm) >= 0.0f) {
            if (id(calibrated_quiet_cm) < id(calibrated_pump_cm) &&
                id(calibrated_pump_cm) < id(calibrated_person_cm)) {
              id(learned_pump_threshold_cm) =
                  0.5f * (id(calibrated_quiet_cm) + id(calibrated_pump_cm));
              id(learned_person_threshold_cm) =
                  id(calibrated_pump_cm) + ${person_profile_on_fraction}f *
                  (id(calibrated_person_cm) - id(calibrated_pump_cm));
              id(active_pump_threshold).publish_state(id(learned_pump_threshold_cm));
              id(active_person_threshold).publish_state(id(learned_person_threshold_cm));
            } else {
              ESP_LOGW("poolguard", "Calibration profiles overlap/out of order; previous thresholds retained");
            }
          }
          id(calibration_active) = false;
      - if:
          condition:
            lambda: 'return id(calibration_samples).size() < 8;'
          then:
            - text_sensor.template.publish:
                id: calibration_status
                state: "Calibration failed - not enough valid A02 data"
          else:
            - if:
                condition:
                  lambda: |-
                    return id(calibrated_quiet_cm) >= 0.0f &&
                           id(calibrated_pump_cm) >= 0.0f &&
                           id(calibrated_person_cm) >= 0.0f &&
                           id(calibrated_quiet_cm) < id(calibrated_pump_cm) &&
                           id(calibrated_pump_cm) < id(calibrated_person_cm);
                then:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Motion calibration complete - learned thresholds active"
                else:
                  - text_sensor.template.publish:
                      id: calibration_status
                      state: "Profile saved - calibrate remaining conditions"

  - id: evaluate_cycle
    mode: restart
    then:
      - output.turn_off: a02_power
      - lambda: |-
          const float configured_report_wakes = id(periodic_report_every_wakes).state;
          const uint32_t report_wakes = (uint32_t) std::lround(
              std::isfinite(configured_report_wakes) ? configured_report_wakes : 30.0f);
          id(status_report_due) = poolguard_rtc.wake_count >= report_wakes;

          if (id(valid_frame_count) < 5) {
            ESP_LOGW("poolguard", "Not enough valid A02 frames: %d", id(valid_frame_count));
            id(report_needed) = id(status_report_due);
            return;
          }

          // Keep an unsorted copy so the two halves of the five-second burst can
          // be evaluated independently. A person transition must be present in
          // both halves; a single splash or pump transient is not enough.
          auto raw_distances = id(sample_distances_mm);
          auto distances = raw_distances;
          std::sort(distances.begin(), distances.end());
          const size_t n = distances.size();
          const size_t low_index = (n - 1) / 10;
          const size_t high_index = ((n - 1) * 9) / 10;
          const float distance_cm_value = ((n % 2)
              ? distances[n / 2]
              : 0.5f * (distances[n / 2 - 1] + distances[n / 2])) / 10.0f;
          const float motion_cm =
              (distances[high_index] - distances[low_index]) / 10.0f;

          auto trimmed_span_cm = [](std::vector<int> values) -> float {
            if (values.size() < 5) return NAN;
            std::sort(values.begin(), values.end());
            const size_t count = values.size();
            const size_t low = (count - 1) / 10;
            const size_t high = ((count - 1) * 9) / 10;
            return (values[high] - values[low]) / 10.0f;
          };
          const size_t split = raw_distances.size() / 2;
          std::vector<int> first_half(raw_distances.begin(), raw_distances.begin() + split);
          std::vector<int> second_half(raw_distances.begin() + split, raw_distances.end());
          const float first_half_motion = trimmed_span_cm(first_half);
          const float second_half_motion = trimmed_span_cm(second_half);

          id(distance_cm).publish_state(distance_cm_value);
          id(water_motion_cm).publish_state(motion_cm);

          float depth_cm = NAN;
          float level_pct = NAN;
          float volume_m3 = NAN;
          if (id(water_reference_distance_cm) > 0.0f &&
              id(water_reference_depth_cm) >= 0.0f) {
            depth_cm = id(water_reference_depth_cm) -
                       (distance_cm_value - id(water_reference_distance_cm));
            depth_cm = std::max(0.0f, std::min((float) ${pool_max_depth_cm}, depth_cm));
            level_pct = 100.0f * depth_cm / (float) ${pool_max_depth_cm};
            const float radius_m = ((float) ${pool_diameter_m}) * 0.5f;
            const float area_m2 = 3.14159265f * radius_m * radius_m;
            volume_m3 = area_m2 * (depth_cm / 100.0f);

            id(water_depth_cm).publish_state(depth_cm);
            id(water_level_percent).publish_state(level_pct);
            id(pool_volume_m3).publish_state(volume_m3);

            const float configured_low_limit = id(minimum_safe_water_depth).state;

            // The running circulation pump lowers the local water level in the
            // skimmer by roughly 2.5–3 cm. This is normal hydraulic drawdown and
            // must not be interpreted as an actual loss of pool water.
            //
            // Pump OFF -> normal user configured limit.
            // Pump ON  -> emergency limit of 99 cm.
            const float low_limit =
                poolguard_rtc.pump_state
                    ? std::min(
                          configured_low_limit,
                          POOLGUARD_PUMP_RUNNING_LOW_WATER_DEPTH_CM)
                    : configured_low_limit;

            const float low_clear =
                low_limit + ${low_water_hysteresis_cm};

            if (!poolguard_rtc.low_water_state) {
              if (depth_cm <= low_limit) {
                if (poolguard_rtc.low_water_on_streak < 255)
                  poolguard_rtc.low_water_on_streak++;

                ESP_LOGI("poolguard",
                         "Low-water candidate: depth=%.1fcm limit=%.1fcm confirmation=%u/%u",
                         depth_cm, low_limit,
                         (unsigned) poolguard_rtc.low_water_on_streak,
                         (unsigned) ${low_water_confirm_cycles});

                if (poolguard_rtc.low_water_on_streak >= ${low_water_confirm_cycles}) {
                  poolguard_rtc.low_water_state = 1;
                  poolguard_rtc.low_water_on_streak = 0;
                  poolguard_rtc.low_water_trigger_depth_cm = depth_cm;
                  id(low_water_trigger_depth).publish_state(depth_cm);
                  ESP_LOGW("poolguard",
                           "LOW WATER confirmed: trigger_depth=%.1fcm limit=%.1fcm",
                           depth_cm, low_limit);
                }
              } else {
                if (poolguard_rtc.low_water_on_streak != 0) {
                  ESP_LOGI("poolguard",
                           "Low-water candidate cleared: depth=%.1fcm limit=%.1fcm",
                           depth_cm, low_limit);
                }
                poolguard_rtc.low_water_on_streak = 0;
              }
            } else {
              poolguard_rtc.low_water_on_streak = 0;
              if (depth_cm >= low_clear) {
                poolguard_rtc.low_water_state = 0;
                ESP_LOGI("poolguard",
                         "Low-water state cleared: depth=%.1fcm clear_at=%.1fcm",
                         depth_cm, low_clear);
              }
            }
            id(low_water_level).publish_state(poolguard_rtc.low_water_state != 0);
          } else {
            poolguard_rtc.low_water_on_streak = 0;
            id(water_depth_cm).publish_state(NAN);
            id(water_level_percent).publish_state(NAN);
            id(pool_volume_m3).publish_state(NAN);
            ESP_LOGW("poolguard", "Water level not calibrated yet");
          }

          const float pump_threshold =
              id(learned_pump_threshold_cm) > 0.0f
                  ? id(learned_pump_threshold_cm)
                  : ${pump_motion_threshold_cm};

          const bool valid_person_profiles =
              id(calibrated_pump_cm) >= 0.0f &&
              id(calibrated_person_cm) > id(calibrated_pump_cm);

          const float person_on_threshold =
              valid_person_profiles
                  ? id(calibrated_pump_cm) +
                        ${person_profile_on_fraction}f *
                            (id(calibrated_person_cm) -
                             id(calibrated_pump_cm))
                  : (id(learned_person_threshold_cm) > 0.0f
                         ? id(learned_person_threshold_cm)
                         : ${person_motion_threshold_cm});

          const float person_clear_threshold =
              valid_person_profiles
                  ? id(calibrated_pump_cm) +
                        ${person_profile_clear_fraction}f *
                            (id(calibrated_person_cm) -
                             id(calibrated_pump_cm))
                  : person_on_threshold * 0.85f;

          id(active_pump_threshold).publish_state(pump_threshold);
          id(active_person_threshold).publish_state(person_on_threshold);

          const bool halves_valid =
              std::isfinite(first_half_motion) &&
              std::isfinite(second_half_motion);

          const bool person_on_evidence =
              halves_valid
                  ? (first_half_motion >= person_on_threshold &&
                     second_half_motion >= person_on_threshold)
                  : motion_cm >= person_on_threshold;

          const bool person_clear_evidence =
              halves_valid
                  ? (first_half_motion < person_clear_threshold &&
                     second_half_motion < person_clear_threshold)
                  : motion_cm < person_clear_threshold;


          // ------------------------------------------------------------
          // PUMP
          //
          // Pump detection is always evaluated independently.
          // A previously detected person must never freeze the pump state.
          // ------------------------------------------------------------

          const bool raw_pump =
              motion_cm >= pump_threshold;

          if (raw_pump) {

            poolguard_rtc.pump_off_streak = 0;

            if (!poolguard_rtc.pump_state) {

              if (poolguard_rtc.pump_on_streak < 255)
                poolguard_rtc.pump_on_streak++;

              if (poolguard_rtc.pump_on_streak >=
                  ${pump_confirm_cycles}) {

                poolguard_rtc.pump_state = 1;
                poolguard_rtc.pump_on_streak = 0;

                ESP_LOGI(
                    "poolguard",
                    "Pump confirmed before person/low-water evaluation");
              }

            } else {

              poolguard_rtc.pump_on_streak = 0;
            }

          } else {

            poolguard_rtc.pump_on_streak = 0;

            if (poolguard_rtc.pump_state) {

              if (poolguard_rtc.pump_off_streak < 255)
                poolguard_rtc.pump_off_streak++;

              if (poolguard_rtc.pump_off_streak >=
                  ${pump_confirm_cycles}) {

                poolguard_rtc.pump_state = 0;
                poolguard_rtc.pump_off_streak = 0;

                ESP_LOGI(
                    "poolguard",
                    "Pump stop confirmed");
              }

            } else {

              poolguard_rtc.pump_off_streak = 0;
            }
          }


          // ------------------------------------------------------------
          // PERSON
          //
          // Do not start a NEW person state while the circulation pump
          // is already confirmed as running. The installed pump produces
          // sustained surface movement which overlaps the learned person
          // motion profile and has produced repeated false alarms.
          //
          // An existing person state is still allowed to clear normally.
          // ------------------------------------------------------------

          if (!poolguard_rtc.person_state) {

            poolguard_rtc.person_off_streak = 0;

            if (poolguard_rtc.pump_state) {

              // Confirmed pump motion must not manufacture a person alarm.
              poolguard_rtc.person_on_streak = 0;

              if (person_on_evidence) {
                ESP_LOGD(
                    "poolguard",
                    "Person-like motion ignored while pump is confirmed running");
              }

            } else if (person_on_evidence) {

              poolguard_rtc.person_on_streak++;

              if (poolguard_rtc.person_on_streak >=
                  ${person_on_confirm_cycles}) {

                poolguard_rtc.person_state = 1;
                poolguard_rtc.person_on_streak = 0;
              }

            } else {

              poolguard_rtc.person_on_streak = 0;
            }

          } else {

            poolguard_rtc.person_on_streak = 0;

            if (person_clear_evidence) {

              poolguard_rtc.person_off_streak++;

              if (poolguard_rtc.person_off_streak >=
                  ${person_off_confirm_cycles}) {

                poolguard_rtc.person_state = 0;
                poolguard_rtc.person_off_streak = 0;
              }

            } else {

              poolguard_rtc.person_off_streak = 0;
            }
          }


          id(pump_detected).publish_state(poolguard_rtc.pump_state != 0);
          id(person_detected).publish_state(poolguard_rtc.person_state != 0);

          const bool pump_changed =
              poolguard_rtc.reported_pump_state != poolguard_rtc.pump_state;
          const bool low_water_changed =
              poolguard_rtc.reported_low_water_state != poolguard_rtc.low_water_state;

          // Person detection is intentionally special:
          //
          // - The first transition to "person detected" is reported immediately.
          // - That report starts a three-hour RTC-only lockout.
          // - During the lockout, local person detection may continue to change,
          //   but those changes NEVER cause Wi-Fi/API to wake.
          // - A periodic/pump/low-water report may still publish the current
          //   person state as part of its normal payload.
          // - Once the lockout expires, a new active person state can again
          //   trigger exactly one immediate report.
          const bool person_alert_allowed =
              poolguard_rtc.person_alert_cooldown_minutes == 0;

          const bool person_alert =
              poolguard_rtc.person_state != 0 &&
              poolguard_rtc.reported_person_state != 1 &&
              person_alert_allowed;

          id(report_needed) =
              pump_changed ||
              low_water_changed ||
              person_alert ||
              id(status_report_due);

          if (person_alert) {
            poolguard_rtc.person_alert_cooldown_minutes =
                ${person_alert_cooldown_minutes};
            ESP_LOGI("poolguard",
                     "Person alert accepted; suppressing further person-triggered reports for %u minutes",
                     (unsigned) poolguard_rtc.person_alert_cooldown_minutes);
          } else if (poolguard_rtc.person_state != poolguard_rtc.reported_person_state &&
                     !person_alert_allowed) {
            ESP_LOGD("poolguard",
                     "Person state changed during alert cooldown; staying offline (%u min remaining)",
                     (unsigned) poolguard_rtc.person_alert_cooldown_minutes);
          }

          ESP_LOGI("poolguard",
                   "frames=%d distance=%.1fcm motion=%.1fcm halves=%.1f/%.1fcm pump_th=%.2f person_on=%.2f person_clear=%.2f pump=%d person=%d low_water=%d low_streak=%u report=%d",
                   id(valid_frame_count), distance_cm_value, motion_cm,
                   first_half_motion, second_half_motion, pump_threshold,
                   person_on_threshold, person_clear_threshold,
                   poolguard_rtc.pump_state, poolguard_rtc.person_state,
                   poolguard_rtc.low_water_state,
                   (unsigned) poolguard_rtc.low_water_on_streak,
                   id(report_needed));
      - if:
          condition:
            lambda: 'return id(report_needed);'
          then:
            # Every report contains a fresh corrected temperature. This local
            # conversion happens before Wi-Fi is enabled.
            - component.update: water_temperature
            - delay: 800ms
            - wifi.enable:
            - wait_until:
                condition:
                  api.connected:
                    state_subscription_only: true
                timeout: 15s
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  - wait_until:
                      condition:
                        lambda: 'return id(maintenance_mode_request).has_state();'
                      timeout: 5s
                  - if:
                      condition:
                        lambda: 'return !id(maintenance_active);'
                      then:
                        - text_sensor.template.publish:
                            id: poolguard_status
                            state: "Reporting"
                  - script.execute: publish_report_payload
                  - script.wait: publish_report_payload
                  # Allow the native API send queue to flush before sleeping.
                  - delay: 500ms
                  - if:
                      condition:
                        api.connected:
                          state_subscription_only: true
                      then:
                        - lambda: |-
                            poolguard_rtc.reported_pump_state = poolguard_rtc.pump_state;
                            poolguard_rtc.reported_person_state = poolguard_rtc.person_state;
                            poolguard_rtc.reported_low_water_state = poolguard_rtc.low_water_state;
                            if (id(status_report_due)) {
                              poolguard_rtc.wake_count = 0;
                              id(status_report_due) = false;
                            }
                      else:
                        - logger.log:
                            level: WARN
                            format: "API disconnected before payload flush; report remains pending"
                else:
                  - logger.log:
                      level: WARN
                      format: "WiFi/API timeout; state change remains pending and will be retried next wake"
      # The HA helper is received only after an existing report connection.
      # Give its subscription state time to arrive before deciding to sleep.
      - if:
          condition:
            lambda: 'return id(maintenance_active);'
          then:
            - wifi.enable:
            - script.execute: maintenance_measurements
          else:
            - if:
                condition:
                  lambda: 'return !id(initial_setup_completed);'
                then:
                  - output.turn_off: a02_power
                  - deep_sleep.prevent: poolguard_sleep
                  - wifi.enable:
                else:
                  - output.turn_off: a02_power
                  - script.execute: enter_low_power_sleep

interval:
  - interval: 20ms
    then:
      - lambda: |-
          while (id(a02_uart).available()) {
            uint8_t byte;
            if (!id(a02_uart).read_byte(&byte)) break;
            auto &frame = id(a02_frame);
            if (frame.empty()) {
              if (byte == 0xFF) frame.push_back(byte);
              continue;
            }
            frame.push_back(byte);
            if (frame.size() < 4) continue;
            const uint8_t checksum = (frame[0] + frame[1] + frame[2]) & 0xFF;
            if (checksum == frame[3]) {
              const int distance_mm = (frame[1] << 8) | frame[2];
              if (distance_mm >= 30 && distance_mm <= 4500) {
                id(sample_distances_mm).push_back(distance_mm);
                id(valid_frame_count)++;
              }
            }
            frame.clear();
          }

  # Live water temperature while awake in maintenance or Initial Setup Mode.
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(maintenance_active) || !id(initial_setup_completed);'
          then:
            - component.update: water_temperature

deep_sleep:
  id: poolguard_sleep

# FIRST WATER-LEVEL CALIBRATION
# 1. Flash PoolGuard once. A factory-state device automatically stays awake in
#    Initial Setup Mode with Wi-Fi/API enabled and the A02 off while idle.
# 2. Measure the actual current pool-water depth in centimetres.
# 3. Enter it in Home Assistant under "Reference Water Depth".
# 4. Press "Set Water Level Reference". PoolGuard stores the current A02
#    distance together with the known real water depth.
# 5. Set "Minimum Safe Water Depth" to the real lowest depth at which the
#    skimmer still supplies the circulation pump safely.
# 6. Sensor-to-bottom distance does not have to be measured separately.
#
# LOW-WATER CONFIRMATION
# One isolated measurement at or below Minimum Safe Water Depth is treated as a
# candidate only. The alarm state is entered after two consecutive low readings.
# With the default two-minute interval this normally confirms on the next wake.
# The exact depth of the confirming measurement is retained in RTC memory and
# exposed as "Low Water Trigger Depth" for diagnostics and HA notifications.
#
# POOL VOLUM
# Volume assumes a cylinder: pi * radius^2 * current water depth.
# Defaults: diameter 5.0 m, maximum depth 120 cm. At 120 cm this is ~23.56 m3.
#
# MOTION CALIBRATION
# In Initial Setup Mode run Quiet Water, Pump and Person for ~60 s each. Learned
# thresholds are based on a trimmed sample span and stored persistently. Motion
# calibration is optional; fallback thresholds remain available. Press "Finish
# Initial Setup" after saving the water reference. No second flash is required.
