substitutions:
  device_name: poolguard
  friendly_name: PoolGuard

  # Verify these GPIO assignments against the final wiring before flashing.
  a02_rx_pin: GPIO20
  a02_power_pin: GPIO2
  one_wire_pin: GPIO4
  battery_adc_pin: GPIO3

  # One short local A02 check roughly every minute. WiFi stays off unless a
  # state changes or the 30-minute status report is due.
  sleep_duration: 55s
  detection_burst_duration: 5s
  status_every_wakes: "30"

  # Experimental motion thresholds. Tune these in the real skimmer.
  pump_motion_threshold_cm: "1.5"
  person_motion_threshold_cm: "3.0"
  pump_confirm_cycles: "2"
  person_on_confirm_cycles: "1"
  person_off_confirm_cycles: "2"

  # Water-level calibration:
  # distance_empty_cm = A02-to-water distance at the LOWEST acceptable level.
  # distance_full_cm  = A02-to-water distance at the HIGHEST normal level.
  # Measure both values with the finished PoolGuard installed in the skimmer.
  distance_empty_cm: !secret poolguard_distance_empty_cm
  distance_full_cm: !secret poolguard_distance_full_cm

  # Safety threshold for the circulation pump.
  # Start with 20 %. After installation, determine the real minimum water level
  # at which the skimmer still feeds the pump reliably and set this accordingly.
  # Hysteresis prevents the warning from toggling around the threshold.
  min_safe_water_level_percent: "20.0"
  low_water_hysteresis_percent: "3.0"

  # Battery divider calibration. Enter the actual resistor values used.
  battery_r_top: !secret poolguard_battery_r_top
  battery_r_bottom: !secret poolguard_battery_r_bottom

  # Battery-level calibration for one Li-ion / 18650 cell.
  # These are deliberately configurable because ADC/divider tolerances vary.
  # Adjust after comparing the calculated level with a multimeter.
  battery_empty_v: "3.20"
  battery_full_v: "4.20"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Battery-powered pool-skimmer level, temperature and motion monitor
  includes:
    - poolguard_rtc.h
  on_boot:
    priority: 600
    then:
      - lambda: |-
          if (poolguard_rtc.magic != POOLGUARD_RTC_MAGIC) {
            poolguard_rtc.magic = POOLGUARD_RTC_MAGIC;
            poolguard_rtc.wake_count = 0;
            poolguard_rtc.pump_state = 0;
            poolguard_rtc.person_state = 0;
            poolguard_rtc.low_water_state = 0;
            poolguard_rtc.reported_pump_state = -1;
            poolguard_rtc.reported_person_state = -1;
            poolguard_rtc.reported_low_water_state = -1;
            poolguard_rtc.pump_on_streak = 0;
            poolguard_rtc.pump_off_streak = 0;
            poolguard_rtc.person_on_streak = 0;
            poolguard_rtc.person_off_streak = 0;
          }

          poolguard_rtc.wake_count++;
          id(sample_count) = 0;
          id(sample_min_mm) = 100000;
          id(sample_max_mm) = 0;
          id(sample_sum_mm) = 0;
          id(valid_frame_count) = 0;
          id(a02_frame).clear();
          id(report_needed) = false;
          id(status_report_due) = (poolguard_rtc.wake_count >= ${status_every_wakes});
      - output.turn_on: a02_power
      - delay: ${detection_burst_duration}
      - script.execute: evaluate_cycle

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

logger:
  baud_rate: 0
  level: INFO

api:
  id: poolguard_api
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: poolguard_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: HIGH
  enable_on_boot: false
  reboot_timeout: 0s
  ap_timeout: 0s

output:
  - platform: gpio
    id: a02_power
    pin: ${a02_power_pin}

uart:
  id: a02_uart
  rx_pin: ${a02_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 256

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}
    id: poolguard_onewire

globals:
  - id: sample_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: valid_frame_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: sample_min_mm
    type: int
    restore_value: no
    initial_value: "100000"
  - id: sample_max_mm
    type: int
    restore_value: no
    initial_value: "0"
  - id: sample_sum_mm
    type: long
    restore_value: no
    initial_value: "0"
  - id: a02_frame
    type: std::vector<uint8_t>
    restore_value: no
  - id: report_needed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: status_report_due
    type: bool
    restore_value: no
    initial_value: "false"

sensor:
  - platform: dallas_temp
    one_wire_id: poolguard_onewire
    index: 0
    name: "Water Temperature"
    id: water_temperature
    resolution: 11
    update_interval: never

  # Internal battery-voltage measurement. Home Assistant only receives the
  # calculated Battery Level percentage below.
  - platform: adc
    pin: ${battery_adc_pin}
    id: battery_voltage_raw
    internal: true
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: !lambda |-
          return (${battery_r_top} + ${battery_r_bottom}) / ${battery_r_bottom};
    on_value:
      then:
        - lambda: |-
            const float empty_v = ${battery_empty_v};
            const float full_v = ${battery_full_v};
            float pct = 100.0f * (x - empty_v) / (full_v - empty_v);
            pct = std::max(0.0f, std::min(100.0f, pct));
            id(battery_level).publish_state(pct);

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: never

  - platform: template
    id: distance_cm
    name: "Distance to Water"
    unit_of_measurement: cm
    accuracy_decimals: 1
    device_class: distance
    state_class: measurement
    update_interval: never

  # Main water-level value used in Home Assistant.
  # 0 % corresponds to distance_empty_cm, 100 % to distance_full_cm.
  - platform: template
    id: water_level_percent
    name: "Water Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never

  # Diagnostic value for tuning pump/person thresholds. It can be hidden later
  # once real skimmer measurements have established reliable thresholds.
  - platform: template
    id: water_motion_cm
    name: "Water Surface Motion"
    unit_of_measurement: cm
    accuracy_decimals: 1
    state_class: measurement
    update_interval: never

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 10s

binary_sensor:
  - platform: template
    id: pump_detected
    name: "Pump Detected"
    device_class: running

  - platform: template
    id: person_detected
    name: "Person Detected"
    device_class: occupancy

  # Safety warning for Home Assistant. This is evaluated every one-minute A02
  # cycle, not only during the 30-minute status report. A state change therefore
  # wakes WiFi immediately so HA can react, e.g. switch the circulation pump off.
  - platform: template
    id: low_water_level
    name: "Low Water Level"
    device_class: problem

button:
  - platform: template
    name: "Measure Now"
    on_press:
      - script.execute: evaluate_cycle

script:
  - id: evaluate_cycle
    mode: restart
    then:
      - output.turn_off: a02_power
      - lambda: |-
          if (id(valid_frame_count) < 5) {
            ESP_LOGW("poolguard", "Not enough valid A02 frames: %d", id(valid_frame_count));
            // Do not change pump/person/low-water state on an invalid burst.
            id(report_needed) = id(status_report_due);
            return;
          }

          const float average_cm = (id(sample_sum_mm) / (float) id(valid_frame_count)) / 10.0f;
          const float motion_cm = (id(sample_max_mm) - id(sample_min_mm)) / 10.0f;
          const float empty_cm = ${distance_empty_cm};
          const float full_cm = ${distance_full_cm};
          float level = 100.0f * (empty_cm - average_cm) / (empty_cm - full_cm);
          level = std::max(0.0f, std::min(100.0f, level));

          id(distance_cm).publish_state(average_cm);
          id(water_motion_cm).publish_state(motion_cm);
          id(water_level_percent).publish_state(level);

          // Low-water safety state with hysteresis.
          const float low_limit = ${min_safe_water_level_percent};
          const float low_clear = low_limit + ${low_water_hysteresis_percent};
          if (!poolguard_rtc.low_water_state && level <= low_limit) {
            poolguard_rtc.low_water_state = 1;
          } else if (poolguard_rtc.low_water_state && level >= low_clear) {
            poolguard_rtc.low_water_state = 0;
          }
          id(low_water_level).publish_state(poolguard_rtc.low_water_state != 0);

          const bool raw_person = motion_cm >= ${person_motion_threshold_cm};

          // Person state debounce.
          if (raw_person) {
            poolguard_rtc.person_off_streak = 0;
            if (!poolguard_rtc.person_state) {
              poolguard_rtc.person_on_streak++;
              if (poolguard_rtc.person_on_streak >= ${person_on_confirm_cycles}) {
                poolguard_rtc.person_state = 1;
                poolguard_rtc.person_on_streak = 0;
              }
            } else {
              poolguard_rtc.person_on_streak = 0;
            }
          } else {
            poolguard_rtc.person_on_streak = 0;
            if (poolguard_rtc.person_state) {
              poolguard_rtc.person_off_streak++;
              if (poolguard_rtc.person_off_streak >= ${person_off_confirm_cycles}) {
                poolguard_rtc.person_state = 0;
                poolguard_rtc.person_off_streak = 0;
              }
            } else {
              poolguard_rtc.person_off_streak = 0;
            }
          }

          // Pump classification is updated only while no person is detected.
          if (!poolguard_rtc.person_state) {
            const bool raw_pump = motion_cm >= ${pump_motion_threshold_cm};
            if (raw_pump) {
              poolguard_rtc.pump_off_streak = 0;
              if (!poolguard_rtc.pump_state) {
                poolguard_rtc.pump_on_streak++;
                if (poolguard_rtc.pump_on_streak >= ${pump_confirm_cycles}) {
                  poolguard_rtc.pump_state = 1;
                  poolguard_rtc.pump_on_streak = 0;
                }
              } else {
                poolguard_rtc.pump_on_streak = 0;
              }
            } else {
              poolguard_rtc.pump_on_streak = 0;
              if (poolguard_rtc.pump_state) {
                poolguard_rtc.pump_off_streak++;
                if (poolguard_rtc.pump_off_streak >= ${pump_confirm_cycles}) {
                  poolguard_rtc.pump_state = 0;
                  poolguard_rtc.pump_off_streak = 0;
                }
              } else {
                poolguard_rtc.pump_off_streak = 0;
              }
            }
          }

          id(pump_detected).publish_state(poolguard_rtc.pump_state != 0);
          id(person_detected).publish_state(poolguard_rtc.person_state != 0);

          const bool pump_changed =
              poolguard_rtc.reported_pump_state != poolguard_rtc.pump_state;
          const bool person_changed =
              poolguard_rtc.reported_person_state != poolguard_rtc.person_state;
          const bool low_water_changed =
              poolguard_rtc.reported_low_water_state != poolguard_rtc.low_water_state;
          id(report_needed) = pump_changed || person_changed || low_water_changed || id(status_report_due);

          ESP_LOGI("poolguard",
                   "frames=%d distance=%.1fcm motion=%.1fcm level=%.0f%% pump=%d person=%d low_water=%d report=%d",
                   id(valid_frame_count), average_cm, motion_cm, level,
                   poolguard_rtc.pump_state, poolguard_rtc.person_state,
                   poolguard_rtc.low_water_state, id(report_needed));
      - if:
          condition:
            lambda: 'return id(status_report_due);'
          then:
            - component.update: water_temperature
            - component.update: battery_voltage_raw
            - delay: 800ms
      - if:
          condition:
            lambda: 'return id(report_needed);'
          then:
            - wifi.enable:
            - wait_until:
                condition:
                  api.connected:
                    state_subscription_only: true
                timeout: 15s
            - if:
                condition:
                  api.connected:
                    state_subscription_only: true
                then:
                  - delay: 750ms
                  - lambda: |-
                      poolguard_rtc.reported_pump_state = poolguard_rtc.pump_state;
                      poolguard_rtc.reported_person_state = poolguard_rtc.person_state;
                      poolguard_rtc.reported_low_water_state = poolguard_rtc.low_water_state;
                      if (id(status_report_due)) {
                        poolguard_rtc.wake_count = 0;
                      }
                      ESP_LOGI("poolguard", "State/status report delivered to Home Assistant");
                else:
                  - logger.log:
                      level: WARN
                      format: "WiFi/API timeout; state change remains pending and will be retried next wake"
            - wifi.disable:
      - deep_sleep.enter:
          id: poolguard_sleep
          sleep_duration: ${sleep_duration}

interval:
  # Parse the common four-byte A02 UART frame:
  # 0xFF, distance high byte, distance low byte, checksum.
  - interval: 20ms
    then:
      - lambda: |-
          while (id(a02_uart).available()) {
            uint8_t byte;
            if (!id(a02_uart).read_byte(&byte)) break;

            auto &frame = id(a02_frame);
            if (frame.empty()) {
              if (byte == 0xFF) frame.push_back(byte);
              continue;
            }

            frame.push_back(byte);
            if (frame.size() < 4) continue;

            const uint8_t checksum = (frame[0] + frame[1] + frame[2]) & 0xFF;
            if (checksum == frame[3]) {
              const int distance_mm = (frame[1] << 8) | frame[2];
              if (distance_mm >= 30 && distance_mm <= 4500) {
                id(sample_min_mm) = std::min(id(sample_min_mm), distance_mm);
                id(sample_max_mm) = std::max(id(sample_max_mm), distance_mm);
                id(sample_sum_mm) += distance_mm;
                id(valid_frame_count)++;
              }
            }
            frame.clear();
          }

deep_sleep:
  id: poolguard_sleep

# Behaviour:
# - Wake roughly once per minute.
# - Power A02 only for a short local measurement burst.
# - Check pump, person and low-water state locally every minute.
# - Keep WiFi disabled during ordinary checks.
# - Report immediately when Pump/Person/Low Water state changes.
# - Report Water Level, Water Temperature and Battery Level about every 30 wakes.
# - If WiFi/API delivery fails, the last-reported RTC state is not updated, so
#   the transition is retried on the next wake.
#
# Calibration checklist after installation:
# 1. Measure A02 distance at the lowest acceptable water level -> distance_empty_cm.
# 2. Measure A02 distance at the highest normal water level -> distance_full_cm.
# 3. Set min_safe_water_level_percent to a level that still guarantees reliable
#    skimmer flow; test this physically before using it for pump protection.
# 4. Compare battery ADC calculation against a multimeter and adjust divider
#    resistor values / battery_empty_v / battery_full_v if necessary.
# 5. Record Water Surface Motion with pump off, pump on and swimmers present,
#    then tune pump_motion_threshold_cm and person_motion_threshold_cm.
#
# Safety:
# - Low Water Level is intended as an automation input, not as the only hardware
#   protection against dry running. Home Assistant can use it to switch the pump
#   off and prevent restart until the water level has recovered.
# - During confirmed person motion, pump state is held at its previous value;
#   one A02 cannot reliably separate simultaneous swimmer and pump motion.
# - RTC state survives deep sleep without per-minute flash writes, but resets
#   after a complete power loss. The first wake after power-up sends a report.
